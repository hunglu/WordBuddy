gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's/Kubernetes' embedded DNS. Used with variables below so nginx resolves upstream
    # hostnames per-request instead of once at startup — a static proxy_pass to an unresolvable
    # hostname (e.g. an upstream container that isn't up yet) would otherwise stop nginx's
    # workers from starting at all, not just 502 that one route.
    resolver 127.0.0.11 valid=10s;

    # Hashed build assets (Vite content-hashes filenames) — cache aggressively.
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Backend routing — one entry per service, same path prefixes the Vite dev proxy uses.
    location /api/auth/ {
        set $identity_upstream http://identity-api:8080;
        proxy_pass $identity_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/lessons/ {
        set $content_upstream http://content-api:8080;
        proxy_pass $content_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/media/ {
        set $content_upstream http://content-api:8080;
        proxy_pass $content_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50m;
    }

    location /api/quiz/ {
        set $quiz_upstream http://quiz-api:8080;
        proxy_pass $quiz_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/progress/ {
        set $progress_upstream http://progress-api:8080;
        proxy_pass $progress_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — anything else goes to index.html, React Router handles the route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
