# Production resource limits. Small defaults for a modest cluster: raise them for real load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: wordbuddy
spec:
  template:
    spec:
      containers:
        - name: identity-api
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
---
