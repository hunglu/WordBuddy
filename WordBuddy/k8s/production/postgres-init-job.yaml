# Creates the four databases and four owner roles (same script as deploy/single-host/postgres/init.sh).
# Jobs are immutable: `make k8s-prod-apply` deletes the finished Job before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  namespace: wordbuddy
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: postgres-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: postgres-init
          image: postgres:17-alpine
          command: ["sh", "/scripts/init.sh"]
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordbuddy-secrets
                  key: POSTGRES_PASSWORD
            - name: IDENTITY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordbuddy-secrets
                  key: IDENTITY_DB_PASSWORD
            - name: CONTENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordbuddy-secrets
                  key: CONTENT_DB_PASSWORD
            - name: QUIZ_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordbuddy-secrets
                  key: QUIZ_DB_PASSWORD
            - name: PROGRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordbuddy-secrets
                  key: PROGRESS_DB_PASSWORD
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
      volumes:
        - name: script
          configMap:
            name: postgres-init-script
