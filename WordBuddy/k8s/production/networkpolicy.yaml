# Default deny ingress, then allow only what the stack needs (WB-75).
# Child data protection: PostgreSQL and RabbitMQ accept traffic only from the API pods (and the
# init / backup jobs for PostgreSQL). Needs a CNI that enforces NetworkPolicy (kindnet does not).
# The ingress controller namespace must be one of the names below; add yours if different.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: wordbuddy
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: wordbuddy
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [wordbuddy-ui, identity-api, content-api, quiz-api, progress-api]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [ingress-nginx, traefik, kube-system, ingress]
      ports:
        - port: 8080
        - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-progress-to-content
  namespace: wordbuddy
spec:
  podSelector:
    matchLabels:
      app: content-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: progress-api
      ports:
        - port: 8080
        - port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apis-to-postgres
  namespace: wordbuddy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [identity-api, content-api, quiz-api, progress-api, postgres-init, postgres-backup]
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apis-to-rabbitmq
  namespace: wordbuddy
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [identity-api, content-api, progress-api]
      ports:
        - port: 5672
