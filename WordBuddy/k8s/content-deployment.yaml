apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-api
  namespace: wordbuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-api
  template:
    metadata:
      labels:
        app: content-api
    spec:
      containers:
        - name: content-api
          image: wordbuddy-content:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: wordbuddy-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: wordbuddy-secrets
                  key: Content_ConnectionStrings__DefaultConnection
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: wordbuddy-secrets
                  key: Jwt__Secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: media-data
              mountPath: /app/media
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: media-data
          emptyDir: {}
