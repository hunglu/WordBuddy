# ClusterIP only: AMQP for content-api / progress-api, management UI via kubectl port-forward.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: wordbuddy
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
