apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  namespace: wordbuddy
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: postgres-init
          image: postgres:17-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordbuddy-secrets
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              for db in WordBuddyIdentity WordBuddyContent WordBuddyQuiz WordBuddyProgress WordBuddyNotification; do
                exists=$(psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'")
                if [ "$exists" != "1" ]; then
                  psql -h postgres -U postgres -c "CREATE DATABASE \"$db\""
                fi
              done
