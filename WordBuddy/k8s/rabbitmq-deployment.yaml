# RabbitMQ message broker (WB-21). Same image as docker-compose.yml.
# Management UI is internal only — no Ingress, NodePort or LoadBalancer. Admins open it with:
#   kubectl -n wordbuddy port-forward svc/rabbitmq 15672:15672   ->  http://localhost:15672
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: wordbuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:management
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: wordbuddy-secrets
                  key: Messaging__RabbitMq__Username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: wordbuddy-secrets
                  key: Messaging__RabbitMq__Password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
      volumes:
        - name: rabbitmq-data
          emptyDir: {}
