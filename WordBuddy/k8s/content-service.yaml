apiVersion: v1
kind: Service
metadata:
  name: content-api
  namespace: wordbuddy
spec:
  selector:
    app: content-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    # Internal gRPC (HTTP/2, cleartext) for Progress. No Ingress rule points here.
    - name: grpc
      port: 8081
      targetPort: 8081
      appProtocol: kubernetes.io/h2c
