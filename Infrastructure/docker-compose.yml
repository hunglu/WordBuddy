name: wordbuddy

services:

  # ── SQL Server ───────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # mssql-tools18 is the path in the 2022 image; fall back to the
      # older mssql-tools path so this works if the image changes.
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD"
          -Q "SELECT 1" -b -o /dev/null 2>/dev/null ||
          /opt/mssql-tools/bin/sqlcmd  -S localhost -U sa -P "$$SA_PASSWORD"
          -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  # ── ASP.NET Core API ─────────────────────────────────────────
  wordbuddy-api:
    build:
      context: ../
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${CONNECTION_STRING}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
      FileStorage__BasePath: /app/media
    ports:
      - "8080:8080"
    volumes:
      - media-data:/app/media
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  # ── React + Nginx UI ─────────────────────────────────────────
  wordbuddy-ui:
    build:
      context: ../../WordBuddy.UI
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - wordbuddy-api
    restart: unless-stopped
    networks:
      - backend

# ── Volumes ──────────────────────────────────────────────────
volumes:
  sqlserver-data:
  media-data:

# ── Networks ─────────────────────────────────────────────────
networks:
  backend:
    driver: bridge
