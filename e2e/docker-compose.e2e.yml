# E2E override: lets the "admin completes escalated unlink" scenario escalate at once.
# Usage (from WordBuddy/): docker compose -f docker-compose.yml -f ../e2e/docker-compose.e2e.yml up -d
services:
  identity-api:
    environment:
      SupportLinks__UnlinkOverrideWaitDays: "0"
  # WB-25: keyless, deterministic auto-fill (Development only). Known words: serendipity, apple,
  # happy, run. Any other word returns autofillUnavailable = true.
  content-api:
    environment:
      Autofill__UseFakeClients: "true"
